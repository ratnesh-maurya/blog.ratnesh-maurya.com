name: Daily AI News Digest

on:
  schedule:
    # 07:30 UTC = 13:00 IST. (For 01:00 IST use '30 19 * * *'.)
    - cron: '30 7 * * *'
  # Run manually from the Actions tab if a day is missed
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if a digest for today already exists'
        type: boolean
        default: false

# Never run two digests at once (a manual run during the schedule would double-publish)
concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily news digest
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_NEWS_TIMEZONE: Asia/Kolkata
          NEWS_FORCE: ${{ inputs.force }}
        run: npm run news:fetch

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain content/news)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news
          git commit -m "chore(news): daily tavily digest"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

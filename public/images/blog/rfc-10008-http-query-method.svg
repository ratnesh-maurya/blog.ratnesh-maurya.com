<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" aria-labelledby="title desc"><title id="title">RFC 10008: The HTTP QUERY Method</title><desc id="desc">A summary graphic introducing the HTTP QUERY method from RFC 10008, comparing GET, POST, and QUERY, with a sample QUERY request.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#e7eefb"/></linearGradient><linearGradient id="card" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient><style>
.h1{font:700 64px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#16213a}
.sub{font:500 27px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#44516a}
.badge{font:700 22px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#ffffff;letter-spacing:2px}
.m{font:700 36px "Avenir Next","Helvetica Neue",Arial,sans-serif}
.p{font:500 22px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#44516a}
.yes{fill:#0e7a4d}.no{fill:#b3403a}
.code{font:600 24px "SF Mono",Menlo,Consolas,monospace;fill:#dbe6ff}
.codek{font:600 24px "SF Mono",Menlo,Consolas,monospace;fill:#7dd3fc}
.codem{font:700 24px "SF Mono",Menlo,Consolas,monospace;fill:#fbbf24}
.foot{font:500 18px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#5d6a84}
</style></defs><path fill="url(#bg)" d="M0 0h1600v900H0z"/><circle cx="1450" cy="120" r="240" fill="#c7d9f7" opacity=".5"/><circle cx="180" cy="790" r="230" fill="#d5c9f2" opacity=".35"/><rect width="1460" height="760" x="70" y="70" fill="url(#card)" stroke="#d4dff2" rx="30"/><rect width="220" height="46" x="130" y="122" fill="url(#accent)" rx="23"/><text x="240" y="153" class="badge" text-anchor="middle">RFC 10008</text><text x="130" y="240" class="h1">The HTTP QUERY Method</text><text x="130" y="290" class="sub">A safe, idempotent, cacheable request — with the query in the body</text><rect width="420" height="230" x="120" y="340" fill="#fff" stroke="#d9e2f2" rx="20"/><text x="150" y="400" class="m" fill="#475569">GET</text><text x="150" y="448" class="p"><tspan class="yes">✓</tspan> Safe &amp; cacheable</text><text x="150" y="490" class="p"><tspan class="no">✗</tspan> Query stuck in URL</text><text x="150" y="532" class="p"><tspan class="no">✗</tspan> Length limits, logged</text><rect width="420" height="230" x="590" y="340" fill="#fff" stroke="#d9e2f2" rx="20"/><text x="620" y="400" class="m" fill="#475569">POST</text><text x="620" y="448" class="p"><tspan class="yes">✓</tspan> Body carries query</text><text x="620" y="490" class="p"><tspan class="no">✗</tspan> Not safe, no retries</text><text x="620" y="532" class="p"><tspan class="no">✗</tspan> Not cacheable</text><rect width="420" height="230" x="1060" y="340" fill="#f5f9ff" stroke="#2563eb" stroke-width="2.5" rx="20"/><text x="1090" y="400" class="m" fill="#2563eb">QUERY</text><text x="1090" y="448" class="p"><tspan class="yes">✓</tspan> Body carries query</text><text x="1090" y="490" class="p"><tspan class="yes">✓</tspan> Safe &amp; idempotent</text><text x="1090" y="532" class="p"><tspan class="yes">✓</tspan> Cacheable like GET</text><rect width="1360" height="160" x="120" y="610" fill="#101a30" rx="20"/><text x="160" y="672" class="code"><tspan class="codem">QUERY</tspan> /contacts HTTP/1.1</text><text x="160" y="710" class="code"><tspan class="codek">Content-Type:</tspan> application/x-www-form-urlencoded</text><text x="160" y="748" class="code">select=surname,email&amp;limit=10&amp;match="email=*@example.*"</text><text x="130" y="805" class="foot">Source: RFC 10008 — Reschke, Snell, Bishop · rfc-editor.org/info/rfc10008</text></svg>
